[project]
name = "ordertrail"
version = "0.1.0"
description = "Evidence-preserving conversation imports for OrderTrail"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.41,<1",
  "sqlalchemy>=2.0.48,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.13,<3",
  "python-multipart>=0.0.22,<1",
  "pillow>=12.1,<13",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["mypy>=1.19,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api/ordertrail"]

[tool.mypy]
files = ["api/ordertrail"]
strict = true
plugins = ["pydantic.mypy"]
