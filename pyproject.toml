[project]
name = "pocketdokani"
version = "0.1.0"
description = "Evidence-preserving conversation imports for PocketDokani"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.41,<1",
  "sqlalchemy>=2.0.48,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.13,<3",
  "python-multipart>=0.0.22,<1",
  "pillow>=12.1,<13",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "ruff>=0.17.3",
    "types-openpyxl>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api/pocketdokani"]

[tool.mypy]
files = ["api/pocketdokani"]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
