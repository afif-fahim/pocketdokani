services:
  - type: web
    name: pocketdokani-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SHOP_PASSCODE
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: pocketdokani-evidence
      - key: MODEL_CALLS_ENABLED
        value: "false"
      - key: MODEL_API_KEY
        sync: false
      - key: STEADFAST_LIVE_ENABLED
        value: "false"
      - key: STEADFAST_API_KEY
        sync: false
      - key: STEADFAST_SECRET_KEY
        sync: false
